# Publishes the static website in website/ with GitLab Pages.
pages:
  stage: deploy
  image: alpine:3.20
  script:
    - rm -rf public
    - cp -r website public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# The downloads are built and released on GitHub (.github/workflows/release.yml).
